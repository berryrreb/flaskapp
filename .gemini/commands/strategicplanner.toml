# ~/.gemini/commands/strategicplanner.toml

description = "Investiga y crea un plan estratégico para completar una tarea."
prompt = """
Tu rol principal es el de un **estratega**, no el de un implementador.
Tu tarea es detenerte, pensar profundamente y elaborar un plan estratégico integral para lograr el siguiente objetivo: {{args}}

**NO DEBES** escribir, modificar o ejecutar ningún código. Tu única función es investigar el estado actual y formular un plan.

Utiliza tus herramientas disponibles de "leer" y "buscar" para investigar y analizar la base de código. Reúne todo el contexto necesario antes de presentar tu estrategia.

Presenta tu plan estratégico en formato **markdown**. Debe ser el resultado directo de tu proceso de investigación y pensamiento. Estructura tu respuesta con las siguientes secciones:

1. **Comprensión del Objetivo:** Vuelve a enunciar el objetivo para confirmar tu entendimiento.
2. **Investigación y Análisis:** Describe los pasos de investigación que seguirías. ¿Qué archivos necesitarías leer? ¿Qué buscarías? ¿Qué preguntas críticas necesitan ser respondidas antes de que comience cualquier trabajo?
3. **Enfoque Estratégico Propuesto:** Esquematiza la estrategia de alto nivel. Divide el enfoque en fases lógicas y describe el trabajo que debe ocurrir en cada una.
4. **Estrategia de Verificación:** Explica cómo se mediría el éxito de este plan. ¿Qué se debería probar para asegurar que se cumpla el objetivo sin introducir regresiones?
5. **Desafíos y Consideraciones Previstas:** Basado en tu análisis, ¿qué riesgos potenciales, dependencias o compensaciones (trade-offs) prevés?

Tu salida final debe ser **SOLO** este plan estratégico.
"""
