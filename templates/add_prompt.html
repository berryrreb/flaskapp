<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Prompt - FlaskPrompt AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') document.body.classList.add('light-mode');
    </script>

    <aside class="sidebar">
        <a href="{{ url_for('index') }}" class="sidebar-icon">
            <i class="fas fa-terminal"></i>
        </a>
        <div class="sidebar-icon">
            <i class="fas fa-layer-group"></i>
        </div>
        <div class="sidebar-icon">
            <i class="fas fa-chart-bar"></i>
        </div>
        <div style="margin-top: auto;">
            <div class="sidebar-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <header>
            <a href="{{ url_for('index') }}" class="logo">Flask<span>Prompt AI</span></a>
            <form action="{{ url_for('index') }}" method="get" class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" name="q" placeholder="Search prompts..." value="{{ search_query }}">
            </form>
            <div class="header-actions">
                <button id="theme-toggle" class="header-icon" title="Toggle Light/Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-profile">
                    <div class="header-icon" title="Notifications">
                        <i class="fas fa-bell"></i>
                    </div>
                    <i class="fas fa-user-circle profile-avatar"></i>
                </div>
            </div>
        </header>

        <div class="content-container">
            <h1>Add New Prompt</h1>
            
            <form method="post">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="e.g., Python Code Generator" required>
                
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g., Development">
                
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="10" placeholder="Paste your prompt here..." required></textarea>
                
                <div style="display: flex; gap: 20px; align-items: center;">
                    <button type="submit">Create Prompt</button>
                    <a href="{{ url_for('index') }}" style="color: var(--text-muted); text-decoration: none;">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const icon = themeToggle.querySelector('i');
        if (document.body.classList.contains('light-mode')) icon.classList.replace('fa-moon', 'fa-sun');

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            icon.classList.replace(isLight ? 'fa-moon' : 'fa-sun', isLight ? 'fa-sun' : 'fa-moon');
        });
    </script>
</body>
</html>
