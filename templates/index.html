<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Prompt Library</h1>
        <a href="{{ url_for('add_prompt') }}" class="button">Add New Prompt</a>
        <div class="prompt-list">
            {% for prompt in prompts %}
            <div class="prompt-card">
                <h2><a href="{{ url_for('view_prompt', prompt_id=prompt.id) }}">{{ prompt.title }}</a></h2>
                <p><strong>Category:</strong> {{ prompt.category }}</p>
                <p>{{ prompt.content[:100] }}...</p>
                <div class="actions">
                    <a href="{{ url_for('edit_prompt', prompt_id=prompt.id) }}" class="button edit">Edit</a>
                    <form action="{{ url_for('delete_prompt', prompt_id=prompt.id) }}" method="post" style="display:inline;">
                        <button type="submit" class="button delete">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
