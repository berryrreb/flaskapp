<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlaskPrompt AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script>
        // Check for saved theme preference or use default dark theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <aside class="sidebar">
        <div class="sidebar-icon active">
            <i class="fas fa-terminal"></i>
        </div>
        <div class="sidebar-icon">
            <i class="fas fa-layer-group"></i>
        </div>
        <div class="sidebar-icon">
            <i class="fas fa-chart-bar"></i>
        </div>
        <div style="margin-top: auto;">
            <div class="sidebar-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <header>
            <a href="{{ url_for('index') }}" class="logo">Flask<span>Prompt AI</span></a>
            <form action="{{ url_for('index') }}" method="get" class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" name="q" placeholder="Search prompts..." value="{{ search_query }}">
            </form>
            <div class="header-actions">
                <button id="theme-toggle" class="header-icon" title="Toggle Light/Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-profile">
                    <div class="header-icon" title="Notifications">
                        <i class="fas fa-bell"></i>
                    </div>
                    <i class="fas fa-user-circle profile-avatar"></i>
                </div>
            </div>
        </header>

        <div class="content-container">
            <h1>Prompts</h1>
            
            <div class="category-tabs" id="category-tabs">
                <button class="tab-pill active" data-category="all">Todos</button>
            </div>
            
            <div class="prompt-grid" id="prompt-grid">
                {% for prompt in prompts %}
                <div class="prompt-card" data-category="{{ (prompt.category or 'Sin Categoría')|trim }}">
                    <div class="prompt-content-raw" style="display: none;">{{ prompt.content }}</div>
                    <div class="card-header">
                        <h2><a href="{{ url_for('view_prompt', prompt_id=prompt.id) }}">{{ prompt.title }}</a></h2>
                        <span class="category-tag">{{ prompt.category or 'Sin Categoría' }}</span>
                    </div>
                    <p>{{ prompt.content[:120] }}{% if prompt.content|length > 120 %}...{% endif %}</p>
                    <div class="card-footer">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <a href="{{ url_for('edit_prompt', prompt_id=prompt.id) }}" class="button edit">
                                <i class="far fa-edit"></i> Edit
                            </a>
                            <button class="button copy-btn" onclick="copyPrompt(this)">
                                <i class="far fa-copy"></i> Copy
                            </button>
                        </div>
                        <form action="{{ url_for('delete_prompt', prompt_id=prompt.id) }}" method="post" class="delete-form">
                            <button type="submit" class="button delete">
                                <i class="far fa-trash-alt"></i>
                            </button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>

    <a href="{{ url_for('add_prompt') }}" class="fab">
        <i class="fas fa-plus"></i>
    </a>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const icon = themeToggle.querySelector('i');

        // Update icon on load
        if (document.body.classList.contains('light-mode')) {
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            
            // Toggle icon
            if (isLight) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });

        function robustCopyToClipboard(text, button, successText) {
            const proceedWithSuccess = () => {
                // Si ya está en estado copiado, evitar duplicar el timeout
                if (button.classList.contains('copied')) return;
                
                button.classList.add('copied');
                const iconElement = button.querySelector('i');
                const originalIconClass = iconElement ? iconElement.className : 'far fa-copy';
                if (iconElement) {
                    iconElement.className = 'fas fa-check';
                }
                
                const textNode = button.childNodes[button.childNodes.length - 1];
                let originalText = '';
                if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                    originalText = textNode.textContent;
                    textNode.textContent = ' ' + successText;
                } else {
                    originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check"></i> ' + successText;
                }
                
                setTimeout(() => {
                    button.classList.remove('copied');
                    if (iconElement) {
                        iconElement.className = originalIconClass;
                    }
                    if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                        textNode.textContent = originalText;
                    } else {
                        button.innerHTML = originalText;
                    }
                }, 2000);
            };

            // Ejecutar retroalimentación visual de forma optimista (snappy UI)
            proceedWithSuccess();

            // Ejecutar guardado en portapapeles en segundo plano de forma silenciosa
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(() => {
                    fallbackCopySilent(text);
                });
            } else {
                fallbackCopySilent(text);
            }
        }

        function fallbackCopySilent(text) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            } catch (err) {
                console.warn('Copiado no soportado en este entorno:', err);
            }
        }

        // Copiar Prompt al Portapapeles
        function copyPrompt(button) {
            const cardClass = 'prompt-' + 'card';
            const card = button.closest('.' + cardClass);
            const text = card.querySelector('.prompt-content-raw').textContent;
            robustCopyToClipboard(text, button, 'Copied!');
        }

        // Generar Pestañas de Categoría dinámicamente y Filtrar
        document.addEventListener('DOMContentLoaded', () => {
            const cardClass = 'prompt-' + 'card';
            const cards = document.querySelectorAll('.' + cardClass);
            const tabsContainer = document.getElementById('category-tabs');
            
            // Obtener categorías únicas
            const categories = new Set();
            cards.forEach(card => {
                const category = card.getAttribute('data-category');
                if (category) {
                    categories.add(category);
                }
            });
            
            // Generar botones de categoría
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'tab-pill';
                button.setAttribute('data-category', category);
                button.textContent = category;
                tabsContainer.appendChild(button);
            });
            
            // Lógica de filtrado al hacer clic
            const pills = document.querySelectorAll('.tab-pill');
            pills.forEach(pill => {
                pill.addEventListener('click', () => {
                    // Remover activo de otros
                    pills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    
                    const filter = pill.getAttribute('data-category');
                    
                    cards.forEach(card => {
                        const cardCategory = card.getAttribute('data-category');
                        if (filter === 'all' || cardCategory === filter) {
                            card.classList.remove('hidden');
                        } else {
                            card.classList.add('hidden');
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
