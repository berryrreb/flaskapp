<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlaskPrompt AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script>
        // Check for saved theme preference or use default dark theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>

    <aside class="sidebar">
        <div class="sidebar-icon active">
            <i class="fas fa-terminal"></i>
        </div>
        <div class="sidebar-icon">
            <i class="fas fa-layer-group"></i>
        </div>
        <div class="sidebar-icon">
            <i class="fas fa-chart-bar"></i>
        </div>
        <div style="margin-top: auto;">
            <div class="sidebar-icon">
                <i class="fas fa-sign-out-alt"></i>
            </div>
        </div>
    </aside>

    <main class="main-wrapper">
        <header>
            <a href="{{ url_for('index') }}" class="logo">Flask<span>Prompt AI</span></a>
            <form action="{{ url_for('index') }}" method="get" class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" name="q" placeholder="Search prompts..." value="{{ search_query }}">
            </form>
            <div class="header-actions">
                <button id="theme-toggle" class="header-icon" title="Toggle Light/Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="user-profile">
                    <div class="header-icon" title="Notifications">
                        <i class="fas fa-bell"></i>
                    </div>
                    <i class="fas fa-user-circle profile-avatar"></i>
                </div>
            </div>
        </header>

        <div class="content-container">
            <h1>Prompts</h1>
            
            <div class="prompt-grid">
                {% for prompt in prompts %}
                <div class="prompt-card">
                    <div class="card-header">
                        <h2><a href="{{ url_for('view_prompt', prompt_id=prompt.id) }}">{{ prompt.title }}</a></h2>
                        <span class="category-tag">{{ prompt.category }}</span>
                    </div>
                    <p>{{ prompt.content[:120] }}{% if prompt.content|length > 120 %}...{% endif %}</p>
                    <div class="card-footer">
                        <a href="{{ url_for('edit_prompt', prompt_id=prompt.id) }}" class="button edit">
                            <i class="far fa-edit"></i> Edit
                        </a>
                        <form action="{{ url_for('delete_prompt', prompt_id=prompt.id) }}" method="post" class="delete-form">
                            <button type="submit" class="button delete">
                                <i class="far fa-trash-alt"></i>
                            </button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>

    <a href="{{ url_for('add_prompt') }}" class="fab">
        <i class="fas fa-plus"></i>
    </a>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const icon = themeToggle.querySelector('i');

        // Update icon on load
        if (document.body.classList.contains('light-mode')) {
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            
            // Toggle icon
            if (isLight) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>
</body>
</html>
